name: Build Windows Installer

# Builds NOVA-Setup.exe on a Windows runner (PyInstaller + Inno Setup) and
# uploads it as a downloadable artifact. Push a tag like v0.1.0 to also attach
# the installer to a GitHub Release.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "webapp/**"
      - "packaging/**"
      - "scripts/build_exe.ps1"
      - "requirements/**"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install FFmpeg (for render tests + bundling)
        run: choco install ffmpeg --no-progress -y

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/desktop.txt -r requirements/dev.txt pyinstaller

      - name: Install LLM runtime (best effort)
        shell: pwsh
        continue-on-error: true
        run: python -m pip install "llama-cpp-python>=0.2.70"

      - name: Run full test suite
        shell: pwsh
        run: |
          python -m pytest -rf --tb=short -o junit_logging=all `
            --junit-xml=pytest-report.xml 2>&1 | Tee-Object -FilePath pytest-out.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the failing-test lines into the job summary AND as
            # workflow errors, so the failure is visible without the artifact.
            "## Pytest failures`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content pytest-out.txt | Select-String -Pattern "FAILED|ERROR|assert|Error|Traceback" |
              ForEach-Object { $_.Line } | Select-Object -First 60 |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content pytest-out.txt | Select-String -Pattern "^FAILED|^ERROR" |
              ForEach-Object { Write-Host ("::error::" + $_.Line) }
          }
          exit $code

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            pytest-out.txt
          if-no-files-found: ignore

      - name: Build PyInstaller bundle
        # The PySide6 desktop app is the shipped UI. The web dashboard spec
        # (packaging/nova_studio_dashboard.spec) remains as an alternative build.
        run: pyinstaller packaging/nova_studio.spec --noconfirm --clean

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $ffdir = "packaging/ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffdir | Out-Null
          # Prefer the FFmpeg Chocolatey installed earlier, but copy the REAL
          # binaries from its lib folder. `Get-Command ffmpeg` resolves to the
          # ~0.4 MB Chocolatey shim in chocolatey\bin, which only forwards to a
          # path that exists on this runner - shipping it broke every install.
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { "C:\ProgramData\chocolatey" }
          $libFf = Join-Path $chocoRoot "lib\ffmpeg"
          $bin = $null
          if (Test-Path $libFf) {
            $bin = Get-ChildItem -Path $libFf -Recurse -Filter "ffmpeg.exe" |
              Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
          }
          if (-not $bin) {
            $urls = @(
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
            $zip = "$env:RUNNER_TEMP/ffmpeg.zip"; $ok = $false
            foreach ($u in $urls) {
              for ($i = 0; $i -lt 3 -and -not $ok; $i++) {
                try { Invoke-WebRequest -Uri $u -OutFile $zip -TimeoutSec 180; $ok = $true }
                catch { Start-Sleep -Seconds 5 }
              }
              if ($ok) { break }
            }
            if (-not $ok) { throw "Could not obtain FFmpeg from any source." }
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/ff" -Force
            $bin = Get-ChildItem -Path "$env:RUNNER_TEMP/ff" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          }
          Copy-Item $bin.FullName "$ffdir/ffmpeg.exe"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "$ffdir/ffprobe.exe"
          # Ship the build's licence (GPL/LGPL obligations) with the binaries.
          $lic = Get-ChildItem -Path (Split-Path $bin.DirectoryName -Parent) -Filter "LICENSE*" |
            Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$ffdir/LICENSE.txt" }
          Write-Host "Bundled FFmpeg from: $($bin.DirectoryName)"

      - name: Verify bundled FFmpeg (rejects shims, must run)
        shell: pwsh
        run: ./scripts/verify_ffmpeg.ps1 -Dir packaging/ffmpeg

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Setup
          path: packaging/Output/NOVA-Setup.exe
          if-no-files-found: error

      - name: Attach to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/NOVA-Setup.exe
