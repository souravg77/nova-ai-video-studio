[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai-video-studio"
version = "0.1.0"
description = "Hardware-aware, offline-capable AI video studio for Windows 11"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See licenses/ for third-party notices" }
authors = [{ name = "NOVA AI Video Studio" }]
dependencies = [
    "pydantic>=2.5",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
nova-studio = "nova_studio.app:main"
nova-hw = "nova_studio.core.hardware_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "hardware: tests that inspect real hardware",
    "offline: tests that must pass with no network",
    "export: tests that render real media via FFmpeg",
    "integration: multi-component tests",
]
